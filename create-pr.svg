<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200"><defs><style>text{dominant-baseline:auto}</style></defs><rect x="0" y="0" width="1920" height="1200" fill="#0b0f14"/><rect x="100" y="40" width="1720" height="1120" fill="#11111b" stroke="#6c7086" stroke-width="2"/><rect x="116" y="64" width="1688" height="1072" fill="none" stroke="#313244" stroke-width="1"/><line x1="116" y1="120" x2="1804" y2="120" stroke="#313244" stroke-width="1"/><text x="132" y="86" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#cba6f7" xml:space="preserve">Create pull request</text><text x="132" y="104" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#6c7086" xml:space="preserve">feat/invoice-filters → main</text><text x="132" y="150" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#ff87d7" xml:space="preserve">● Title</text><text x="132" y="168" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">Add saved filters to invoices</text><text x="132" y="204" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#6c7086" xml:space="preserve">  Body</text><text x="132" y="222" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#f9e2af" xml:space="preserve">## Summary</text><text x="132" y="240" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">- add saved invoice filters with label, date range, and status presets</text><text x="132" y="258" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">- persist filter chips per workspace in local storage</text><text x="132" y="276" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">- include empty-state copy when no saved filters exist</text><text x="132" y="312" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#f9e2af" xml:space="preserve">## Test plan</text><text x="132" y="330" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">- go test ./...</text><text x="132" y="348" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">- manually verified draft restore and filter chip removal</text><text x="132" y="384" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#6c7086" xml:space="preserve">  Diff vs base</text><text x="132" y="402" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cba6f7" xml:space="preserve">diff --git a/internal/invoices/filters.go b/internal/invoices/filters.go</text><text x="132" y="420" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#ff87d7" xml:space="preserve">@@ -12,6 +12,18 @@ type FilterSet struct {</text><text x="132" y="438" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">+ type SavedFilter struct {</text><text x="132" y="456" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">+     Name      string</text><text x="132" y="474" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">+     Query     url.Values</text><text x="132" y="492" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">+     CreatedAt time.Time</text><text x="132" y="510" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">+ }</text><text x="132" y="528" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">+ </text><text x="132" y="546" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">+ func (f *FilterSet) Save(name string) SavedFilter {</text><text x="132" y="564" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">+     return SavedFilter{Name: name, Query: f.ToValues(), CreatedAt: time.Now()}</text><text x="132" y="582" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">+ }</text><text x="132" y="618" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cba6f7" xml:space="preserve">diff --git a/ui/invoices/view.go b/ui/invoices/view.go</text><text x="132" y="636" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#ff87d7" xml:space="preserve">@@ -44,7 +44,9 @@ func renderHeader(w io.Writer, state State) {</text><text x="132" y="654" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#f38ba8" xml:space="preserve">-     renderFilterBar(filters)</text><text x="132" y="672" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">+     renderSavedFilterBar(filters, saved)</text><text x="132" y="690" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">+     if len(saved) == 0 {</text><text x="132" y="708" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">+         renderEmptyState(w, "No saved filters yet")</text><text x="132" y="726" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">+     }</text><text x="132" y="1102" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#6c7086" xml:space="preserve">tab  switch fields   ctrl+s  create PR   esc  cancel</text></svg>
