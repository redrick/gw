<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200"><defs><style>text{dominant-baseline:auto}</style></defs><rect x="0" y="0" width="1920" height="1200" fill="#0b0f14"/><rect x="100" y="40" width="1720" height="1120" fill="#11111b" stroke="#6c7086" stroke-width="2"/><rect x="116" y="64" width="1688" height="1072" fill="none" stroke="#313244" stroke-width="1"/><line x1="116" y1="120" x2="1804" y2="120" stroke="#313244" stroke-width="1"/><text x="132" y="86" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#cba6f7" xml:space="preserve">Pull request</text><text x="132" y="104" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve"><tspan fill="#ff87d7">● Conversation</tspan><tspan fill="#6c7086">   Files changed   tab/←/→ switch</tspan></text><text x="132" y="150" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#ff87d7" xml:space="preserve">#1287 Checkout redesign</text><text x="132" y="168" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#6c7086" xml:space="preserve">OPEN  opened by @avery · feat/checkout-redesign → main</text><text x="132" y="186" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cba6f7" xml:space="preserve">review: REVIEW_REQUIRED</text><text x="132" y="204" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#6c7086" xml:space="preserve">https://github.com/acme/web/pull/1287</text><text x="132" y="240" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#cba6f7" xml:space="preserve">Description</text><text x="132" y="258" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">Adds the new checkout drawer, persists cart recovery state across navigation,</text><text x="132" y="276" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">and wires analytics events for checkout start, complete, and abandon.</text><text x="132" y="312" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#cba6f7" xml:space="preserve">Test plan</text><text x="132" y="330" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">- go test ./...</text><text x="132" y="348" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">- manually verified mobile checkout recovery on Chrome and Firefox</text><text x="132" y="384" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#cba6f7" xml:space="preserve">Checks</text><text x="132" y="402" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">  ✓  ci/test          passed   42s</text><text x="132" y="420" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">  ✓  ci/lint          passed   8s</text><text x="132" y="438" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#a6e3a1" xml:space="preserve">  ✓  ci/build         passed   1m12s</text><text x="132" y="456" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#f9e2af" xml:space="preserve">  ○  deploy/preview   pending</text><text x="132" y="492" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#cba6f7" xml:space="preserve">Conversation</text><text x="132" y="528" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#cdd6f4" xml:space="preserve">@morgan  2026-05-15 12:04</text><text x="132" y="546" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">Can we keep the payment summary sticky on small screens? It scrolls out</text><text x="132" y="564" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">of view when the address form is long.</text><text x="132" y="600" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#cdd6f4" xml:space="preserve">@jamie  2026-05-15 12:22</text><text x="132" y="618" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">The retry copy looks good. Please add one fixture for expired cards —</text><text x="132" y="636" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">the error path is tested but no fixture covers the UI state.</text><text x="132" y="672" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#cdd6f4" xml:space="preserve">@ci-bot  2026-05-15 12:31</text><text x="132" y="690" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">Preview deployed to https://checkout-1287.preview.example.test</text><text x="132" y="726" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#cdd6f4" xml:space="preserve">@avery  2026-05-15 14:05</text><text x="132" y="744" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">Fixed sticky summary with position:sticky + max-height trick. Fixture added</text><text x="132" y="762" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#cdd6f4" xml:space="preserve">in TestCheckoutUI_ExpiredCard. Ready for re-review.</text><text x="132" y="1102" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="normal" fill="#6c7086" xml:space="preserve">↑/↓ j/k pgup/pgdn scroll   tab  switch tabs   q/esc  close   18%</text></svg>
